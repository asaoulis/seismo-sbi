run_name: croatia_pert_5pc
output_directory: '/data/alex/cps/alex'
job_name: pert_gen
generate_dataset: True
num_jobs: 30

# Base config for generate_croatia_5pc_perturbations.py. The generator loops over the
# 4 multi_models, overriding velocity_model + receiver subset + cps_GFs_path per model.
# Stations here is the FULL 10-station geometry; receivers are filtered in Python per model
# (avoids the single-station genfromtxt issue for model3/CACV).

seismic_context:
  simulation_type: 'cps'
  components: 'ZEN'
  stations_path: './configs/croatia/event1_stations.txt'
  station_components_path: './configs/croatia/components.json'
  seismogram_duration: 200
  sampling_rate: 1
  syngine_address: "/data/shared/ROSA_PREM_10s_disc"
  cps_GFs_path: '/data/alex/cps/cps_croatia/multi_models_5pc/_placeholder/kappa_5'           # overridden per model
  cps_GFs_fiducial_path: '/data/alex/cps/cps_croatia/multi_models_5pc/_placeholder/kappa_5_fiducial'
  processing:
    filter:
      type: 'bandpass'
      freqmin: 0.02
      freqmax: 0.05
      corners: 4
      zerophase: False
    sampling_rate: 1.0

parameters:
  inference:
    moment_tensor:
      #         [Mrr, Mt, Mpp, Mrt, Mrp, Mtp]
      fiducial: [1.e+16, 1.e+16, 1.e+16, 1.e+16, 1.e+16, 1.e+16]
      stencil_deltas: [1.e+10, 1.e+10, 1.e+10, 1.e+10, 1.e+10, 1.e+10]
      bounds: [[-2.e+16, -2.e+16, -2.e+16, -2.e+16, -2.e+16, -2.e+16],
              [2.e+16, 2.e+16, 2.e+16, 2.e+16, 2.e+16, 2.e+16]]
  nuisance:
    source_location:
      #         [lat, long, depth, time]
      fiducial: [45.879, 16.028, 5, 0]
      bounds: [45.879, 16.028, 5, 0]
    velocity_model:
      # overridden per model by the generator; must be a valid model file to parse
      fiducial: '/home/alex/work/seismo-sbi/scripts/configs/croatia/multi_models_txt/model1.txt'
      bounds: ['/home/alex/work/seismo-sbi/scripts/configs/croatia/multi_models_txt/model1.txt', 5]

simulations:
  num_simulations: 8000
  sampling_method:
    moment_tensor: "uniform"
    source_location: "constant"
    velocity_model: "velocity model"
  use_fisher_to_constrain_bounds: 15
  iterative_least_squares:
    max_iterations: 8
    damping_factor: 0.0
    dynamic_damping: False
    mcmc_chain_for_mle: False

compression:
  theory_optimal_score:
    noise_level:  1.e-7
    diag_regularisation_magnitude: 0.005

inference:
  sbi:
    method: 'posterior'
    pipeline: 'single_event'
    noise_model:
      type: 'gaussian_filtered'
      noise_level: null
  likelihood:
    run: False

jobs:
  real_events: {}
  simulations:
    random_events: 100
    fixed_events: []
    custom_events:
      fiducial_model:
        moment_tensor: [3.e+14, -3.e+14, 0,0,0,0]
        source_location: [45.879, 16.028, 5, 0]
        use_fiducial: True
  noise_models:
    gaussian_filtered: null
  plots:
    async_plotting: True
    disable_plotting: True
