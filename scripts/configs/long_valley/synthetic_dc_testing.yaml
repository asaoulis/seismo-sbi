run_name: correct_noise_model
output_directory: '/data/alex/cps/alex'
job_name: synthetic_dc
generate_dataset: True
num_jobs: 30

seismic_context:
  simulation_type: 'cps_precomputed' # 'instaseis' or 'cps'
  components: 'ZEN'
  stations_path: './configs/long_valley/stations.txt'
  station_components_path: './configs/long_valley/components.json'
  seismogram_duration: 200
  sampling_rate: 1
  syngine_address: "/data/shared/ROSA_PREM_10s_disc" # if no local version, can use "syngine://prem_i_2s"
  cps_GFs_path: '/data/alex/cps/cps_long_valley/kappa_5pc_depth'
  cps_GFs_fiducial_path: '/data/alex/cps/cps_long_valley/fiducial'
  processing:
    filter_sampling_rate: 40.0
    filter:
      type: 'bandpass'
      freqmin: 0.025
      freqmax: 0.1
      corners: 4
      zerophase: False
    sampling_rate: 0.5

parameters:
  inference:
    moment_tensor:
      #         [Mrr, Mt, Mpp, Mrt, Mrp, Mtp]
      fiducial: [1.e+14, 1.e+14, 1.e+14, 1.e+14, 1.e+14, 1.e+14]
      stencil_deltas: [1.e+10, 1.e+10, 1.e+10, 1.e+10, 1.e+10, 1.e+10]
      bounds: [[-5.e+14, -5.e+14, -5.e+14, -5.e+14, -5.e+14, -5.e+14],
              [5.e+14, 5.e+14, 5.e+14, 5.e+14, 5.e+14, 5.e+14]]
  nuisance: 
    source_location:
      #         [lat, long, depth, time]
      fiducial: [37.636, -118.936, 5, 0]
      bounds: [37.636, -118.936, 5, 0]
    velocity_model:
      fiducial: '/home/alex/work/seismo-sbi/scripts/data/SoCal.plain.txt'
      bounds: ['/home/alex/work/seismo-sbi/scripts/data/SoCal.plain.txt', 5]

simulations:
  num_simulations: 5000
  sampling_method: 
    moment_tensor: "uniform"
    source_location: "constant"
    velocity_model: "velocity model"
  use_fisher_to_constrain_bounds: False
  iterative_least_squares:
    max_iterations: 4
    damping_factor: 0.01

compression: 
  theory_optimal_score:
    noise_level:  0.1

inference:
  sbi:
    method: 'posterior'
    pipeline: 'single_event'
    noise_model: 
      type: 'gaussian'
      noise_level: 0.1

  likelihood: 
    run: True
    ensemble: False
    covariance: empirical
    num_samples: 40000
    walker_burn_in: 1000
    move_size: [0.005, 0.001]


jobs:
  real_events: {}
  simulations:
    random_events: 3
    fixed_events: []
    custom_events: 
      synthetic_dc_wrong_model:
        moment_tensor: [3.e+14, -3.e+14,0,0,0,0]
        source_location: [37.636, -118.936, 5, 0]
        use_fiducial: False
      synethic_dc_correct_model:
        moment_tensor: [3.e+14, -3.e+14, 0,0,0,0]
        source_location: [37.636, -118.936, 5, 0]
        use_fiducial: True
  noise_models:
    # real_noise: './data/noise/azores_event_samples'
    gaussian_noises: [1.0]
  plots:
    async_plotting: True
    test_posteriors: 
      chain_consumer: 
        - [['theory_optimal_score', 'gaussian_noises_x1.0'], ['gaussian_likelihood', 'gaussian_noises_x1.0']]
    disable_plotting: False