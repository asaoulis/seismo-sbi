run_name: MIYTEC_real_data
output_directory: '/data/alex/cps/alex'
job_name: MIYTEC_MLE
generate_dataset: True
num_jobs: 30

seismic_context:
  simulation_type: 'cps_precomputed' # 'instaseis' or 'cps'
  components: 'ZEN'
  stations_path: './configs/japan/stations.txt'
  station_components_path: './configs/japan/components.json'
  station_time_shifts_path: './configs/japan/station_shifts.json'
  seismogram_duration: 200
  sampling_rate: 1
  syngine_address: "/data/shared/ROSA_PREM_10s_disc" # if no local version, can use "syngine://prem_i_2s"
  cps_GFs_path: '/data/alex/cps/cps_japan/perturbations/kappa_5'
  cps_GFs_fiducial_path: '/data/alex/cps/cps_japan/perturbations/kappa_5_fiducial'
  processing:
    filter:
      type: 'bandpass'
      freqmin: 0.02
      freqmax: 0.05
      corners: 4
      zerophase: False
    sampling_rate: 1.0

parameters:
  inference:
    moment_tensor:
      #         [Mrr, Mt, Mpp, Mrt, Mrp, Mtp]
      fiducial: [1.e+18, 1.e+18, 1.e+18, 1.e+18, 1.e+18, 1.e+18]
      # fiducial: [1.0985209128388177e+18, -1.2581734406853128e+18, 2.229652527846495e+18, -8.380361649391023e+17, -3.985697520973377e+16, 4.0408647753592873e+18]
      stencil_deltas: [1.e+12, 1.e+12, 1.e+12, 1.e+12, 1.e+12, 1.e+12]
      bounds: [[-6.e+18, -6.e+18, -6.e+18, -6.e+18, -6.e+18, -6.e+18],
              [6.e+18, 6.e+18, 6.e+18, 6.e+18, 6.e+18, 6.e+18]]
  nuisance: 
    source_location:
      #         [lat, long, depth, time]
      fiducial: [33.968, 139.414, 8, 0]
      bounds: [33.968, 139.414, 8, 0]
    velocity_model:
      fiducial: '/home/alex/work/seismo-sbi/scripts/data/JapanNakamichi.txt'
      bounds: ['/home/alex/work/seismo-sbi/scripts/data/JapanNakamichi.txt', 5]

simulations:
  num_simulations: 5000
  sampling_method: 
    moment_tensor: "uniform"
    source_location: "constant"
    velocity_model: "velocity model"
  use_fisher_to_constrain_bounds: null
  iterative_least_squares:
    max_iterations: 8
    damping_factor: 0.1
    dynamic_damping: False

compression: 
  theory_optimal_score:
    noise_level:  2.e-8
    diag_regularisation_magnitude: 0.01

inference:
  sbi:
    method: 'posterior'
    pipeline: 'single_event'
    noise_model: 
      type: 'gaussian_filtered'
      noise_level: null

  likelihood: 
    run: True
    ensemble: False
    covariance: empirical
    num_samples: 40000
    walker_burn_in: 1000
    move_size: [0.0001, 0.0001]


jobs:
  real_events:
    MIYTEC: ./data/events/japan_event_filt_20_50_1hz.h5
  simulations:
    random_events: 0
    fixed_events: []
    custom_events: {}
  noise_models:
    # real_noise: './data/noise/azores_event_samples'
    gaussian_filtered: null
  plots:
    async_plotting: True
    test_posteriors: 
      chain_consumer: 
        - [['theory_optimal_score', 'gaussian_filtered'], ['gaussian_likelihood', 'gaussian_filtered']]
    disable_plotting: False
