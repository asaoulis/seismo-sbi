[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seismo-sbi"
version = "0.0.1"
authors = [{ name="Alex Saoulis", email="a.saoulis@ucl.ac.uk" }]
description = "Simulation-based inference for seismic source inversion"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

dynamic= ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "unit: fast, isolated, no I/O",
    "integration: loads data stubs or runs short pipelines",
    "slow: end-to-end synthetic inversions (skipped by default; use -m slow to run)",
]