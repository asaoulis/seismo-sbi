[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seismo-sbi"
version = "0.2.0"
authors = [{ name="Alex Saoulis", email="a.saoulis@ucl.ac.uk" }]
description = "Simulation-based inference for seismic source inversion"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

# The conda-forge scientific, seismology and geospatial stack (instaseis, obspy, numpy, scipy,
# h5py, matplotlib, cartopy, basemap, pyproj, pandas, statsmodels, netcdf4) comes from
# environment.yml, so pip does not re-resolve those binary packages; numpy is pinned here only so
# that no pip dependency downgrades it below the 2.x instaseis needs.
dependencies = [
    "numpy>=2",
    "scipy",
    "h5py",
    "pyyaml",
    "joblib",
    "tqdm",
    "emcee",
    "scikit-learn",
    "statsmodels",
    "pyrocko",
    "platformdirs",
    "click",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "sbi==0.21.0", "arviz<1", "pytorch_lightning", "tarp==0.1.0", "deprecation"]
plotting = ["ChainConsumer==0.34.0", "scienceplots"]
notebooks = ["jupyter", "ipykernel"]
test = ["pytest>=7", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "unit: fast, isolated, no I/O",
    "integration: loads data stubs or runs short pipelines",
    "slow: end-to-end tests including network downloads (skipped by default; use -m slow to run)",
    "requires_data: needs local data or a local forward-model database; skipped when absent",
]