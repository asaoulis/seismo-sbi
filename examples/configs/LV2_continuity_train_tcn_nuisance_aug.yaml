# LV2_continuity_train_tcn_nuisance_aug.yaml
# ============================================================
# TCN NPE training with nuisance parameters folded in via the NEW
# TRAINING-TIME AUGMENTATION route (stage: training_augmentation), rather than
# baked into the simulation dataset.
#
# What this means:
#   * The 75000-sim training set is generated CLEAN (noise- and nuisance-free):
#     the three Category-2 effects below are staged `training_augmentation`, so
#     `set_simulation_objects` excludes them from the per-simulation
#     post-processing chain and `simulate_test_jobs` produces clean sims.
#   * During `train_NPE`, `build_augmentation_chain` reads these nuisances and
#     `TorchSimulationDataset.__getitem__` applies them per-batch to the clean
#     data BEFORE noise is added (val loader included).  The activation scalar
#     for each effect is taken from its `fiducial` value (per-station probability
#     for amplitude/dropout/coda; on/off switch for time_shift_error).
#
# Architecture: TCN (CompressionTrainer station_encoder="tcn").
# Dataset size: jobs.simulations.random_events = 75000.  Epochs: --epochs 200.
#
# Fire-and-forget (cwd = repo root):
#   T=train-tcn-nuisance-aug
#   mkdir -p .claude/runs/LV2-cps-continuity/$T/logs
#   setsid nohup bash scripts/continuity/run_pipeline.sh $T \
#       >.claude/runs/LV2-cps-continuity/$T/logs/boot.log 2>&1 &
#
# TIME-SHIFT CONTINUITY NOTE: time shifts used to be applied in train_NPE via
# random_shift_distribution=(2,3) on the dataloader (array-wide N(0,2) + per-station
# U(-3,3)).  That path is retired — all time-shift handling now lives in the nuisance
# stage.  To preserve the SAME random distributions, the new TimeShiftErrorEffect keeps
# the Gaussian at sigma=2 (gaussian_sigma=2, now the per-station component) and the
# uniform at half-width=3 (uniform_offset=3, now the array-wide common component).  At
# 1 Hz seconds≈samples so magnitudes carry over directly.  (Component SCOPE — which is
# common vs per-station — is flipped vs the legacy code; the per-distribution magnitudes
# are preserved, which is the behaviour the continuity test cares about.)
#
# stf_duration (GCMT STF) is intentionally OMITTED — it is a no-op on the
# cps_precomputed path.  NEVER re-download or re-preprocess LV2 data.
# ============================================================

run_name: continuity_tcn_nuisance_aug
output_directory: '/data/alex/long_valley/continuity/continuity_tcn_nuisance_aug'

# Per-station encoder for the ML compressor (cnn | pno | tcn). Read by train_NPE.py.
ml_architecture: tcn
job_name: results
generate_dataset: True
num_jobs: 30

seismic_context:
  simulation_type: 'cps_precomputed'
  components: 'ZEN'
  stations_path: './configs/stations.txt'
  station_components_path: './configs/components.json'
  station_time_shifts_path: './configs/LV2_station_shifts.json'
  seismogram_duration: 200
  sampling_rate: 1
  syngine_address: "/data/shared/ROSA_PREM_10s_disc"
  cps_path: "/home/alex/work/cps/PROGRAMS.330/bin"
  cps_GFs_path: './data/models/LV2_perturbations/kappa_5.0'
  cps_GFs_fiducial_path: './data/models/LV2_perturbations/kappa_5.0_fiducial'
  processing:
    filter_sampling_rate: 20.0
    filter:
      type: 'bandpass'
      freqmin: 0.02
      freqmax: 0.05
      corners: 4
      zerophase: False
    sampling_rate: 1

parameters:
  inference:
    moment_tensor:
      #         [Mrr, Mt, Mpp, Mrt, Mrp, Mtp]
      fiducial: [1.e+16, 1.e+16, 1.e+16, 1.e+16, 1.e+16, 1.e+16]
      stencil_deltas: [1.e+10, 1.e+10, 1.e+10, 1.e+10, 1.e+10, 1.e+10]
      bounds: [[-4.e+16, -4.e+16, -4.e+16, -4.e+16, -4.e+16, -4.e+16],
              [4.e+16, 4.e+16, 4.e+16, 4.e+16, 4.e+16, 4.e+16]]
  nuisance:
    source_location:
      #         [lat, long, depth, time]
      fiducial: [37.636, -118.936, 5, 0]
      bounds: [37.636, -118.936, 5, 0]
    velocity_model:
      fiducial: '../examples/configs/SoCal.plain.txt'
      bounds: ['../examples/configs/SoCal.plain.txt', 5]

    # ---- Category-2 nuisances, applied as TRAINING-TIME AUGMENTATION ----
    # stage: training_augmentation  → NOT baked into sims; folded in per-batch by
    # the dataloader.  The `fiducial` scalar is the activation value used by
    # build_augmentation_chain (per-station probability, or on/off for time-shift).
    amplitude_error:
      fiducial: [0.2]            # 20% of stations mis-scaled per realisation
      bounds: [0.0, 1.0]
      scale_range: [0.7, 1.4]    # multiplicative amplitude error on affected stations
      stage: training_augmentation
    time_shift_error:
      fiducial: [1.0]            # on/off switch (>0 ⇒ active)
      bounds: [0.0, 1.0]
      uniform_offset: 3.0        # array-wide common shift, U(-3,3) s   (matches old per-station U(-3,3))
      gaussian_sigma: 2.0        # per-station shift, N(0,2) s          (matches old array-wide N(0,2))
      lanczos_order: 5
      stage: training_augmentation
    scattering_coda:
      fiducial: [0.4]            # 40% of stations get a coda tail
      bounds: [0.0, 1.0]
      alpha_range: [0.2, 0.6]    # per-station coda strength ~ U(0.2, 0.6)
      mode: "stahler"
      coda_fraction: 0.25
      stage: training_augmentation

simulations:
  # NPE training-set size is set by jobs.simulations.random_events (75000) below.
  # num_simulations drives the (smaller) score-compression dataset only.
  num_simulations: 1000
  sampling_method:
    moment_tensor: "uniform"
    source_location: "constant"
    velocity_model: "velocity model"
    # Augmentation-staged nuisances are no-ops at simulation time (excluded from the
    # per-sim chain); held constant so the generated sims stay clean.
    amplitude_error: "constant"
    time_shift_error: "constant"
    scattering_coda: "constant"
  use_fisher_to_constrain_bounds: 10
  iterative_least_squares:
    max_iterations: 8
    damping_factor: 0.1
    dynamic_damping: False
    mcmc_chain_for_mle: 1

compression:
  theory_optimal_score:
    noise_level: 1.e-8
    diag_regularisation_magnitude: 0.005
    data_covariance: kolb

inference:
  sbi:
    method: 'posterior'
    pipeline: 'single_event'
    noise_model:
      type: 'gaussian_filtered'
      noise_level: null
  likelihood:
    run: False
    ensemble: False
    covariance: empirical
    num_samples: 20000
    walker_burn_in: 500
    move_size: [0.0001, 0.0001]

jobs:
  real_events:
    LV2: ./data/preprocessed/LV2/events/LV2_noise_filt_20_50_1hz.h5
  simulations:
    random_events: 75000   # NPE training-set size (generated by simulate_test_jobs)
    fixed_events: []
    custom_events: {}
  noise_models:
    gaussian_filtered: null
  plots:
    async_plotting: True
    test_posteriors:
      chain_consumer: []
    disable_plotting: True
