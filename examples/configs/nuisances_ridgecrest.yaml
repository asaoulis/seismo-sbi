# A small neural posterior for the 2019 Ridgecrest foreshock (Mw 6.4) at six regional stations,
# 20-50 s, 0.5 Hz, source fixed at the GCMT centroid. Driven by examples/nuisances.ipynb, which
# sets the database and the output directory and adds its own site-response nuisance block.

run_name: nuisances_ridgecrest
output_directory: './data/pipeline_outputs/nuisances_ridgecrest'
job_name: results
generate_dataset: True
num_jobs: 8
skip_compression_data: True

ml_architecture: tcn
ml_encoder:
  channels: 16
  n_blocks: 2
  kernel_size: 3
  downsample: 4
ml_optimizer:
  lr: 3.e-3
ml_batch:
  train: 64
  val: 256
  num_workers: 4
  train_fraction: 0.9

seismic_context:
  simulation_type: 'instaseis'
  components: 'ZEN'
  stations_path: './configs/ridgecrest_stations.txt'
  station_components_path: './configs/ridgecrest_components.json'
  seismogram_duration: 350
  sampling_rate: 0.5
  syngine_address: '/data/shared/prem_a_20s'
  processing:
    filter_sampling_rate: 1.0
    filter:
      type: 'bandpass'
      freqmin: 0.02
      freqmax: 0.05
      corners: 4
      zerophase: False
    sampling_rate: 0.5

parameters:
  inference:
    moment_tensor:
      #         [m_rr, m_tt, m_pp, m_rt, m_rp, m_tp] (N m)
      fiducial: [0.0, -5.e+18, 5.e+18, 0.0, 0.0, 0.0]
      stencil_deltas: [1.e+16, 1.e+16, 1.e+16, 1.e+16, 1.e+16, 1.e+16]
      bounds: [[-8.e+18, -8.e+18, -8.e+18, -8.e+18, -8.e+18, -8.e+18],
               [8.e+18, 8.e+18, 8.e+18, 8.e+18, 8.e+18, 8.e+18]]
  nuisance:
    source_location:
      #         [latitude, longitude, depth_km, time shift s]: the GCMT centroid
      fiducial: [35.69, -117.54, 12.7, 9.4]
      bounds: [35.69, -117.54, 12.7, 9.4]
    time_shift_error:
      fiducial: [1.0]
      bounds: [0.0, 1.0]
      gaussian_sigma: 1.0
      stage: training_augmentation

simulations:
  num_simulations: 2000
  sampling_method:
    moment_tensor: "uniform"
    source_location: "constant"
    time_shift_error: "constant"

compression: {}

inference:
  sbi:
    method: 'posterior'
    pipeline: 'single_event'
    noise_model:
      type: 'gaussian'
      noise_level: 2.e-5
  likelihood:
    run: False

jobs:
  real_events: {}
  simulations:
    random_events: 2000
    fixed_events: []
    custom_events: {}
  noise_models: {}
  plots:
    disable_plotting: True
